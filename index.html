<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NutriLog 30</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --g:#3B6D11;--gl:#EAF3DE;--gm:#639922;
  --a:#BA7517;--al:#FAEEDA;
  --r:#A32D2D;--rl:#FCEBEB;
  --b:#185FA5;--bl:#E6F1FB;
  --tl:#0F6E56;--tll:#E1F5EE;
  --gy:#5F5E5A;--gyl:#F1EFE8;
  --pu:#534AB7;--pul:#EEEDFE;
  --bg:#fff;--bg2:#f8f8f6;--bg3:#f0efe8;
  --tx:#1a1a18;--tx2:#5f5e5a;--tx3:#888780;
  --bd:rgba(0,0,0,0.1);
  --rr:12px;--rs:8px;
}
@media(prefers-color-scheme:dark){:root{--bg:#1a1a18;--bg2:#232320;--bg3:#2c2c2a;--tx:#f0efe8;--tx2:#888780;--tx3:#5f5e5a;--bd:rgba(255,255,255,0.08);--gl:#1a2e10;--al:#2e2010;--rl:#2e1010;--bl:#0e1e30;--tll:#0a1e18;--gyl:#232320;--pul:#1e1c3a}}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--bg2);color:var(--tx);font-size:14px;line-height:1.5;min-height:100vh}
.screen{display:none}.screen.active{display:block}
/* AUTH */
.auth-page{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1rem;background:linear-gradient(135deg,var(--gl) 0%,var(--bg2) 60%)}
.auth-box{width:100%;max-width:420px;background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--rr);padding:2rem;box-shadow:0 8px 40px rgba(0,0,0,.08)}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:2rem}
.brand-icon{width:48px;height:48px;background:var(--gm);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:24px}
.brand-name{font-size:24px;font-weight:800;color:var(--tx)}
.brand-tag{font-size:11px;color:var(--tx2);letter-spacing:.6px;text-transform:uppercase;margin-top:1px}
.atabs{display:flex;background:var(--bg2);border-radius:var(--rs);padding:3px;gap:3px;margin-bottom:1.5rem}
.atab{flex:1;padding:8px;text-align:center;border-radius:6px;cursor:pointer;font-size:13px;color:var(--tx2);font-weight:500;transition:all .15s}
.atab.on{background:var(--bg);color:var(--tx);font-weight:700;box-shadow:0 1px 6px rgba(0,0,0,.1)}
.fld{margin-bottom:1rem}
.fld label{display:block;font-size:11px;font-weight:700;color:var(--tx2);margin-bottom:5px;text-transform:uppercase;letter-spacing:.5px}
.fld input,.fld select{width:100%;padding:10px 12px;border:0.5px solid var(--bd);border-radius:var(--rs);background:var(--bg2);color:var(--tx);font-size:14px;font-family:inherit;transition:border-color .2s}
.fld input:focus,.fld select:focus{outline:none;border-color:var(--gm);background:var(--bg)}
.btn{width:100%;padding:12px;background:var(--g);color:#fff;border:none;border-radius:var(--rs);font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .15s}
.btn:hover{background:var(--tl);transform:translateY(-1px)}
.btn-sm{width:auto;padding:6px 14px;font-size:13px;font-weight:600}
.btn-ghost{background:transparent;color:var(--tx);border:0.5px solid var(--bd);font-weight:500}
.btn-ghost:hover{background:var(--bg2);transform:none}
.hint{text-align:center;font-size:12px;color:var(--tx3);margin-top:.75rem;padding:8px;background:var(--bg2);border-radius:var(--rs)}
/* WELCOME HERO */
.welcome-hero{min-height:100vh;display:flex;flex-direction:column;background:#0d1f0a;overflow:hidden;position:relative}
.hero-bg{position:absolute;inset:0;background:url('https://images.unsplash.com/photo-1490645935967-10de6ba17061?w=1400&q=80') center/cover no-repeat;opacity:.38}
.hero-overlay{position:absolute;inset:0;background:linear-gradient(180deg,rgba(13,31,10,.25) 0%,rgba(13,31,10,.65) 45%,rgba(13,31,10,.97) 100%)}
.hero-content{position:relative;z-index:2;display:flex;flex-direction:column;min-height:100vh}
.hero-nav{display:flex;align-items:center;justify-content:space-between;padding:1.25rem 2rem}
.hero-brand{display:flex;align-items:center;gap:10px;color:#fff;font-weight:800;font-size:18px}
.hero-brand-ico{width:36px;height:36px;background:rgba(255,255,255,.15);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:18px;backdrop-filter:blur(8px)}
.hero-skip{padding:8px 16px;border:1px solid rgba(255,255,255,.25);border-radius:20px;color:rgba(255,255,255,.7);font-size:13px;cursor:pointer;background:rgba(255,255,255,.08);backdrop-filter:blur(8px);font-family:inherit;transition:all .2s}
.hero-skip:hover{background:rgba(255,255,255,.18);color:#fff}
.hero-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2rem 1.5rem}
.hero-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 14px;border-radius:20px;background:rgba(99,153,34,.25);border:1px solid rgba(99,153,34,.5);color:#8dcc4a;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;margin-bottom:1.5rem}
.hero-h1{font-size:clamp(2.2rem,6vw,3.8rem);font-weight:900;color:#fff;line-height:1.1;margin-bottom:1rem;max-width:700px}
.hero-h1 span{color:#8dcc4a}
.hero-desc{font-size:clamp(15px,2.5vw,18px);color:rgba(255,255,255,.72);line-height:1.7;max-width:560px;margin-bottom:2rem}
.hero-stats{display:flex;gap:2.5rem;margin-bottom:2.5rem;flex-wrap:wrap;justify-content:center}
.hs-n{font-size:30px;font-weight:900;color:#8dcc4a}
.hs-l{font-size:12px;color:rgba(255,255,255,.5);font-weight:500;margin-top:2px}
.hero-cta{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-bottom:3rem}
.cta-primary{padding:15px 36px;background:#639922;color:#fff;border:none;border-radius:40px;font-size:16px;font-weight:800;cursor:pointer;font-family:inherit;transition:all .2s;box-shadow:0 4px 24px rgba(99,153,34,.5)}
.cta-primary:hover{background:#3B6D11;transform:translateY(-2px);box-shadow:0 8px 32px rgba(99,153,34,.6)}
.cta-secondary{padding:15px 32px;background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:40px;font-size:16px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s;backdrop-filter:blur(8px)}
.cta-secondary:hover{background:rgba(255,255,255,.2);transform:translateY(-2px)}
.feat-strip{background:rgba(0,0,0,.45);backdrop-filter:blur(16px);border-top:1px solid rgba(255,255,255,.08);padding:1.5rem 2rem}
.feat-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;max-width:900px;margin:0 auto}
.feat{display:flex;align-items:flex-start;gap:10px}
.feat-ico{width:36px;height:36px;border-radius:8px;background:rgba(99,153,34,.2);border:1px solid rgba(99,153,34,.3);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.feat-t{font-size:13px;font-weight:700;color:#fff;margin-bottom:2px}
.feat-s{font-size:11px;color:rgba(255,255,255,.5);line-height:1.4}
/* PLAN MODAL */
.plan-overlay{position:fixed;inset:0;background:rgba(0,0,0,.65);z-index:400;display:none;align-items:center;justify-content:center;padding:1rem;backdrop-filter:blur(6px)}
.plan-overlay.open{display:flex}
.plan-modal{background:var(--bg);border-radius:var(--rr);padding:2rem;width:100%;max-width:520px;box-shadow:0 24px 80px rgba(0,0,0,.3);animation:modalIn .25s ease;max-height:90vh;overflow-y:auto}
@keyframes modalIn{from{opacity:0;transform:scale(.94) translateY(12px)}to{opacity:1;transform:none}}
.plan-modal h2{font-size:20px;font-weight:800;margin-bottom:4px}
.plan-modal .pm-sub{font-size:13px;color:var(--tx2);margin-bottom:1.5rem}
.dur-opt{border:1.5px solid var(--bd);border-radius:var(--rs);padding:.875rem;cursor:pointer;text-align:center;transition:all .2s;background:var(--bg)}
.dur-opt:hover{border-color:var(--gm);background:var(--gl)}
.dur-opt.sel{border-color:var(--gm);background:var(--gl);box-shadow:0 0 0 3px rgba(99,153,34,.15)}
.dur-opt.sel div:first-child{color:var(--g)}
.cal-opt{text-align:center;padding:.75rem;border:0.5px solid var(--bd);border-radius:var(--rs);cursor:pointer;font-size:13px;font-weight:600;transition:border-color .2s;background:var(--bg);color:var(--tx)}
.cal-opt:hover{border-color:var(--gm)}
.cal-opt-sel{border:1.5px solid var(--gm)!important;background:var(--gl)!important;color:var(--g)!important}
.plan-step{display:none}.plan-step.on{display:block}
.psb-row{display:flex;gap:6px;margin-bottom:1.5rem}
.psb{flex:1;height:4px;border-radius:2px;background:var(--bg2);transition:background .3s}
.psb.done{background:var(--gm)}
.goal-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:1.25rem}
.gc{border:1.5px solid var(--bd);border-radius:var(--rs);padding:1rem;cursor:pointer;transition:all .2s;text-align:center}
.gc:hover{border-color:var(--gm);background:var(--gl)}
.gc.sel{border-color:var(--gm);background:var(--gl);box-shadow:0 0 0 3px rgba(99,153,34,.15)}
.gc-ico{font-size:28px;margin-bottom:6px}
.gc-title{font-size:14px;font-weight:700}
.gc-sub{font-size:11px;color:var(--tx2);margin-top:2px}
/* NAV */
.nav{display:flex;align-items:center;justify-content:space-between;padding:0 1.5rem;height:56px;background:var(--bg);border-bottom:0.5px solid var(--bd);position:sticky;top:0;z-index:200}
.nav-logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:17px;color:var(--tx)}
.nav-logo-ico{width:32px;height:32px;background:var(--gm);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:17px}
.nav-tabs{display:flex;gap:2px}
.nt{padding:7px 14px;border-radius:var(--rs);cursor:pointer;font-size:13px;font-weight:500;color:var(--tx2);border:none;background:transparent;font-family:inherit;transition:all .15s}
.nt.on,.nt:hover{background:var(--gl);color:var(--g)}
.nt-new{color:var(--g)!important;font-weight:700!important}
.nav-r{display:flex;align-items:center;gap:10px}
.badge-day{font-size:12px;color:var(--tx2);background:var(--bg2);padding:4px 10px;border-radius:20px;font-weight:600}
.av{width:34px;height:34px;border-radius:50%;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--g)}
/* MAIN */
.main{max-width:900px;margin:0 auto;padding:1.75rem 1.5rem 4rem}
.pg{display:none}.pg.on{display:block}
.pg-title{font-size:22px;font-weight:800;margin-bottom:4px}
.pg-sub{font-size:13px;color:var(--tx2);margin-bottom:1.5rem}
/* CARDS */
.card{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--rr);padding:1.25rem;margin-bottom:1rem}
.ch{font-size:11px;font-weight:700;color:var(--tx2);text-transform:uppercase;letter-spacing:.6px;margin-bottom:.875rem;display:flex;align-items:center;justify-content:space-between;gap:8px}
/* METRICS */
.mg{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1rem}
.mc{background:var(--bg);border:0.5px solid var(--bd);border-radius:var(--rs);padding:.875rem;text-align:center}
.mv{font-size:26px;font-weight:800;line-height:1}
.ml{font-size:11px;color:var(--tx2);margin-top:4px}
.mc.ok .mv{color:var(--g)}.mc.lo .mv{color:var(--a)}.mc.bad .mv{color:var(--r)}
/* PROGRESS BARS */
.pr{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.pl{font-size:12px;width:88px;flex-shrink:0;color:var(--tx2)}
.pbw{flex:1;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden}
.pb{height:100%;border-radius:4px;transition:width .7s cubic-bezier(.4,0,.2,1)}
.pv{font-size:12px;width:72px;text-align:right;color:var(--tx2)}
.c-g{background:var(--gm)}.c-a{background:var(--a)}.c-r{background:var(--r)}.c-b{background:var(--b)}
/* AI ANALYSER */
.ai-analyser{background:linear-gradient(135deg,#0d1f0a 0%,#1a3a10 100%);border-radius:var(--rr);padding:1.5rem;margin-bottom:1rem;position:relative;overflow:hidden;border:0.5px solid rgba(99,153,34,.3)}
.ai-analyser::before{content:'';position:absolute;top:-40px;right:-40px;width:160px;height:160px;border-radius:50%;background:rgba(99,153,34,.1);pointer-events:none}
.aia-hd{display:flex;align-items:center;gap:10px;margin-bottom:1rem;position:relative;z-index:1}
.aia-ico{width:40px;height:40px;border-radius:10px;background:rgba(99,153,34,.25);border:1px solid rgba(99,153,34,.4);display:flex;align-items:center;justify-content:center;font-size:20px}
.aia-title{font-size:16px;font-weight:800;color:#fff}
.aia-sub{font-size:12px;color:rgba(255,255,255,.55);margin-top:1px}
.aia-body{position:relative;z-index:1}
.aia-score-row{display:flex;gap:8px;margin-bottom:1rem;flex-wrap:wrap}
.aia-chip{padding:5px 12px;border-radius:20px;font-size:12px;font-weight:700}
.aia-feedback{background:rgba(0,0,0,.35);border-radius:var(--rs);padding:1rem;border:1px solid rgba(99,153,34,.2)}
.aia-row{display:flex;align-items:flex-start;gap:10px;margin-bottom:.625rem}
.aia-row:last-child{margin-bottom:0}
.aia-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;margin-top:4px}
.aia-text{font-size:13px;color:rgba(255,255,255,.85);line-height:1.5}
.aia-text strong{color:#8dcc4a}
.aia-p-row{display:flex;align-items:center;gap:8px;margin-bottom:5px}
.aia-p-lbl{font-size:11px;color:rgba(255,255,255,.5);width:80px;flex-shrink:0}
.aia-p-bar{flex:1;height:6px;background:rgba(255,255,255,.1);border-radius:3px;overflow:hidden}
.aia-p-fill{height:100%;border-radius:3px;transition:width .7s ease}
.aia-p-val{font-size:11px;color:rgba(255,255,255,.45);width:34px;text-align:right}
/* 30-DAY COMPLETE CARD */
.plan-complete-card{background:linear-gradient(135deg,#0d1f0a,#1a2e10);border-radius:var(--rr);padding:1.75rem;margin-bottom:1rem;border:1px solid rgba(141,204,74,.3);position:relative;overflow:hidden}
.plan-complete-card::before{content:'🎉';position:absolute;font-size:80px;opacity:.08;top:-10px;right:-10px}
.pcc-title{font-size:20px;font-weight:900;color:#8dcc4a;margin-bottom:.5rem}
.pcc-sub{font-size:14px;color:rgba(255,255,255,.65);margin-bottom:1.25rem;line-height:1.6}
.pcc-btns{display:flex;gap:10px;flex-wrap:wrap}
.pcc-btn{padding:11px 22px;border-radius:var(--rs);font-size:13px;font-weight:700;cursor:pointer;border:none;font-family:inherit;transition:all .2s}
.pcc-btn-primary{background:#8dcc4a;color:#0d1f0a}
.pcc-btn-primary:hover{background:#a3d960;transform:translateY(-1px)}
.pcc-btn-secondary{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2)}
.pcc-btn-secondary:hover{background:rgba(255,255,255,.2)}
/* HEATMAP */
.hm-cell{border-radius:4px;cursor:default;transition:transform .1s;aspect-ratio:1;min-height:18px}
.hm-cell:hover{transform:scale(1.3);z-index:2;position:relative}
.hm-legend{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--tx3);margin-top:.5rem;flex-wrap:wrap}
.hm-swatch{width:14px;height:14px;border-radius:3px;display:inline-block}
/* WATER TRACKER */
.water-tracker{background:linear-gradient(135deg,#0a1e30,#0e2a42);border-radius:var(--rr);padding:1.25rem;margin-bottom:1rem;border:0.5px solid rgba(24,95,165,.3)}
.wt-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:.875rem}
.wt-title{font-size:14px;font-weight:800;color:#93c5fd}
.wt-notif{font-size:10px;padding:2px 8px;border-radius:20px;background:rgba(239,68,68,.2);color:#f87171;border:1px solid rgba(239,68,68,.3);margin-left:8px}
.wt-cups{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:.875rem}
.wt-cup{width:32px;height:32px;border-radius:6px;border:1.5px solid rgba(147,197,253,.3);background:rgba(147,197,253,.08);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:all .2s}
.wt-cup.filled{background:rgba(59,130,246,.35);border-color:rgba(147,197,253,.6)}
.wt-cup:hover{transform:scale(1.1)}
.wt-stats{display:flex;justify-content:space-between;align-items:center}
.wt-ml{font-size:22px;font-weight:800;color:#93c5fd}
.wt-goal-lbl{font-size:11px;color:rgba(147,197,253,.5);margin-top:2px}
.wt-btn{padding:6px 13px;border-radius:var(--rs);border:1px solid rgba(147,197,253,.3);background:rgba(59,130,246,.15);color:#93c5fd;cursor:pointer;font-size:12px;font-weight:700;font-family:inherit;transition:all .2s}
.wt-btn:hover{background:rgba(59,130,246,.3)}
/* COMMUNITY */

.cc-hd{font-size:14px;font-weight:800;color:#c4b5fd;margin-bottom:.75rem}
.cc-btn{width:100%;padding:10px;border-radius:var(--rs);background:rgba(139,92,246,.25);border:1px solid rgba(139,92,246,.4);color:#c4b5fd;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:.75rem;transition:all .2s}
.cc-btn:hover{background:rgba(139,92,246,.4)}
.cc-feed-item{padding:.625rem;background:rgba(255,255,255,.05);border-radius:var(--rs);margin-bottom:.5rem;font-size:12px;color:rgba(255,255,255,.65);border:0.5px solid rgba(139,92,246,.15)}
.cc-name{font-weight:700;color:#c4b5fd;margin-right:6px}
/* SWAP SUGGESTIONS */
.swap-card{background:var(--al);border:0.5px solid var(--a);border-radius:var(--rs);padding:.875rem;margin-top:.75rem}
.swap-hd{font-size:13px;font-weight:700;color:var(--a);margin-bottom:.5rem;display:flex;align-items:center;gap:6px}
.swap-row{display:flex;align-items:center;gap:8px;margin-bottom:.375rem;font-size:13px}
.swap-from{color:var(--r);text-decoration:line-through;opacity:.7}
.swap-arrow{color:var(--g);font-weight:700}
.swap-to{color:var(--g);font-weight:600}
/* PRESETS */
.preset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin-bottom:.5rem}
.preset-item{border:0.5px solid var(--bd);border-radius:var(--rs);padding:.75rem;cursor:pointer;text-align:left;transition:all .15s;position:relative;background:var(--bg)}
.preset-item:hover{border-color:var(--gm);background:var(--gl)}
.preset-name{font-size:13px;font-weight:700;margin-bottom:3px}
.preset-cal{font-size:11px;color:var(--tx3)}
.preset-del{position:absolute;top:4px;right:6px;background:none;border:none;cursor:pointer;font-size:14px;color:var(--tx3);padding:2px;opacity:0;transition:opacity .15s}
.preset-item:hover .preset-del{opacity:1}
/* MEAL FORM */
.meal-types{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:1.25rem}
.mt{border:1.5px solid var(--bd);border-radius:var(--rs);padding:1rem .75rem;cursor:pointer;text-align:center;transition:all .2s}
.mt:hover{border-color:var(--gm);background:var(--gl)}
.mt.on{border-color:var(--gm);background:var(--gl);box-shadow:0 0 0 3px rgba(99,153,34,.12)}
.mt-ico{font-size:24px;margin-bottom:5px}
.mt-n{font-size:13px;font-weight:700}
.mt-s{font-size:11px;color:var(--tx2);margin-top:2px}
/* DATE PICKER ROW */
.date-row{display:flex;align-items:center;gap:10px;padding:.625rem .875rem;background:var(--bg2);border-radius:var(--rs);margin-bottom:.875rem;font-size:13px;color:var(--tx2)}
.date-row input[type=date]{border:0.5px solid var(--bd);border-radius:6px;padding:4px 8px;font-family:inherit;font-size:13px;background:var(--bg);color:var(--tx);cursor:pointer}
.date-row input[type=date]:focus{outline:none;border-color:var(--gm)}
textarea{width:100%;padding:11px 13px;border:0.5px solid var(--bd);border-radius:var(--rs);background:var(--bg2);color:var(--tx);font-size:14px;min-height:90px;resize:vertical;font-family:inherit;line-height:1.6;transition:all .2s}
textarea:focus{outline:none;border-color:var(--gm);background:var(--bg);box-shadow:0 0 0 3px rgba(99,153,34,.08)}
.log-btn{width:100%;padding:13px;background:var(--g);color:#fff;border:none;border-radius:var(--rs);font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .2s;margin-top:.75rem;display:flex;align-items:center;justify-content:center;gap:8px}
.log-btn:hover{background:var(--tl);transform:translateY(-1px)}
.log-btn:disabled{background:var(--gy);cursor:not-allowed;transform:none}
.nut-chip{background:var(--gl);border:0.5px solid var(--gm);border-radius:var(--rs);padding:1rem;margin-top:.875rem}
.nut-chip-hd{font-size:13px;font-weight:700;color:var(--g);margin-bottom:.625rem}
.nut-vals{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.nv{text-align:center}
.nv-v{font-size:15px;font-weight:800;color:var(--g)}
.nv-l{font-size:10px;color:var(--tl);text-transform:uppercase;letter-spacing:.3px;margin-top:2px}
/* LOG ENTRIES */
.le{display:flex;align-items:flex-start;gap:10px;padding:.75rem 0;border-bottom:0.5px solid var(--bd)}
.le:last-child{border-bottom:none}
.mbadge{padding:3px 10px;border-radius:20px;font-size:11px;font-weight:700;flex-shrink:0;margin-top:2px}
